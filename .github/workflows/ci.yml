name: numerical-reproducibility

on:
  push:
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run static checks for submission infrastructure
        run: ruff check scripts/gate_a_v3/result_validation.py scripts/gate_a_v3/32_audit_gate_d1_n4_weight_screen.py scripts/gate_a_v3/gate_d2_validation.py scripts/gate_a_v3/33_run_gate_d2_n6_weight_transfer.py scripts/gate_a_v3/34_audit_gate_d2_n6_weight_transfer.py scripts/run_submission_checks.py scripts/release_preflight.py scripts/submission tests

      - name: Run unit and committed-result regression tests
        run: python -m pytest -q

      - name: Run no-write submission audit
        run: python scripts/run_submission_checks.py --check-only

      - name: Validate release metadata and clean-tree policy
        run: python scripts/release_preflight.py --skip-submission-checks

      - name: Confirm checks leave the working tree clean
        run: git diff --exit-code
