name: numerical-reproducibility

on:
  push:
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run unit and committed-result regression tests
        run: python -m pytest -q

      - name: Run no-write submission audit
        run: python scripts/run_submission_checks.py --check-only

      - name: Confirm checks leave the working tree clean
        run: git diff --exit-code
